<div class="container-fluid" data-ng-controller="RelatorioAtendentesController" ng-init="onInit()">

    <div class="card">
        <div class="card-header ch-alt">
            <h2>{{'RELATORIO-ATENDENTES'| translate}}</h2>
            
            <button title="{{'BUSCAR'| translate}}" class="btn bgm-blue btn-float btn-float-2 waves-effect" ng-click="getAtendentes()"><i class="zmdi zmdi-search"></i></button>
        </div>
    </div>

    <br/>

    <div class="card">
        <div class="card-body card-padding">
            <br/>
            <div class="row">             
                <div class="col-sm-6">
                    <div class="form-group fg-float m-b-30">
                        <div class="fg-line">
                            <select ng-change="getAtendentes()" class="form-control input-lg select-simples" ng-model="filtro.departamento">
                                <option value="-1">{{'TODOS'|translate}}</option>
                                <option ng-repeat="departamento in departamentos" value="{{departamento.id}}">{{departamento.nome}}</option>
                            </select>
                            <label class="fg-label">{{'DEPARTAMENTOS'|translate}}</label>
                        </div>
                    </div>
                </div>
                <div class="col-sm-2">
                    <div class="form-group fg-float m-b-30">
                        <div class="fg-line">
                            <select ng-change="getAtendentes()" class="form-control input-lg select-simples" ng-model="filtro.status">
                                <option value="Todos">{{'TODOS'|translate}}</option>
                                <option value="Aguardando">{{'AGUARDANDO'|translate}}</option>
                                <option value="Ativo">{{'ATIVO'|translate}}</option>
                                <option value="Finalizado">{{'FINALIZADO'|translate}}</option>
                            </select>
                            <label class="fg-label">{{'STATUS'|translate}}</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <br/>

    <div ng-if="registros.length === 0" class="text-center">
        {{'NENHUM-REGISTRO'| translate}}
    </div>

    <div ng-if="registros.length > 0" class="card">
        <div class="card-body">
            <div>
                <table id="content-table" class="table table-striped table-vmiddle">
                    <thead>
                        <tr>
                            <th>{{'DEPARTAMENTOS'|translate}}</th>
                            <th>{{'ATENDENTE'|translate}}</th>                            
                            <th>{{'ATENDIMENTOS'|translate}}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="registro in registros">
                            <td>
                                {{ registro.departamento}}
                            </td>
                            <td>
                                {{ registro.atendente}}
                            </td>                            
                            <td >
                                {{ registro.atendimentos}}
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
