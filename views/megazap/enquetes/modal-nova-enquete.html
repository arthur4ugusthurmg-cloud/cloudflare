<div class="modal-header">
    <h3>{{'NOVA-ENQUETE'|translate}}<small>{{'NOVO-REGISTRO-DESCRICAO'|translate}}</small></h3>
</div>
<div class="modal-body">
    <br/>
    <div class="row">
        <div class="col-sm-2">
            <div class="form-group fg-float m-b-30">
                <div class="fg-line">
                    <input name="nome" type="number" class="form-control fg-input input-lg" ng-model="novoRegistro.numero" autofocus>
                    <label class="fg-label">{{'NUMERO'|translate}}</label>
                </div>
            </div>
        </div>
        <div class="col-sm-12">
            <div class="form-group fg-float m-b-30">
                <div class="fg-line">
                    <textarea class="form-control input-lg" msd-elastic ng-model="novoRegistro.texto"></textarea>
                    <label class="fg-label">{{'TEXTO'|translate}}</label>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button class="btn btn-link" ng-click="onModalInserir()">{{'ENVIAR'|translate}}</button>
    <button class="btn btn-link" ng-click="onModalCancelar()">{{'CANCELAR'|translate}}</button>
</div>
