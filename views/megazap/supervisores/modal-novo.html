<div class="modal-header">
    <h3>Novo Supervisor<small>{{'NOVO-REGISTRO-DESCRICAO'|translate}}</small></h3>
</div>
<div class="modal-body">
    <br />

    <div class="row m-b-30" ng-if="isGestor()">
        <div class="col-sm-12 text-center">
            <div id="imagem-input" class="fileinput fileinput-new" data-provides="fileinput">
                <div class="fileinput-preview thumbnail" data-trigger="fileinput" style="line-height: 200px;">
                    <img ng-src="{{registro.imagem}}" />
                </div>
                <div>
                    <span class="btn btn-info btn-file">
                        <span class="fileinput-new">{{'SELECIONAR-IMAGEM'|translate}}</span>
                        <span class="fileinput-exists">{{'ALTERAR'|translate}}</span>
                        <input type="file" name="...">
                    </span>
                    <a href="#" class="btn btn-danger fileinput-exists" data-dismiss="fileinput">{{'REMOVER'|translate}}</a>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-sm-12">
            <div class="form-group fg-float m-b-30">
                <div class="fg-line">
                    <input name="nome" type="text" class="form-control fg-input input-lg" ng-model="novoRegistro.nome" autofocus>
                    <label class="fg-label">{{'NOME'|translate}}</label>
                </div>
            </div>
        </div>
        <div class="col-sm-12" ng-if="isRevendedor()">
            <div class="form-group fg-float m-b-30">
                <div class="fg-line">
                    <input name="nome" type="text" class="form-control fg-input input-lg" ng-model="novoRegistro.permissaoDocumento" autofocus>
                    <label class="fg-label">{{ "PERMISSAO-DOCUMENTO-CLIENTE" | translate }}</label>
                </div>
            </div>
        </div>
        <div class="col-sm-12">
            <div class="form-group fg-float m-b-30">
                <div class="fg-line">
                    <input name="login" type="text" class="form-control fg-input input-lg" ng-model="novoRegistro.login">
                    <label class="fg-label">{{'LOGIN'|translate}}</label>
                </div>
            </div>
        </div>
        <div class="col-sm-12">
            <div class="form-group fg-float m-b-30">
                <div class="fg-line">
                    <input name="email" type="text" class="form-control fg-input input-lg" ng-model="novoRegistro.emailAtendente">
                    <label class="fg-label">{{'EMAIL'|translate}}</label>
                </div>
            </div>
        </div>
        <div class="col-sm-12" ng-if="isRevendedor()">
            <div class="checkbox checkbox-inline p-l-0 m-b-25">
                <label>
                    <input type="checkbox" data-ng-model="novoRegistro.apenasVisualizacao">
                    <i class="input-helper"></i>
                    {{ "APENAS-VISUALIZACAO" | translate }}
                </label>
            </div>
        </div>
    </div>
    <div class="alert alert-info" role="alert">
        <i class="zmdi zmdi-alert-circle-o zmdi-hc-fw"></i> {{"AVISO-EMAIL-SENHA" | translate}}
    </div>
</div>
<div class="modal-footer">
    <button class="btn btn-link" ng-click="onModalInserir()">{{'ENVIAR'|translate}}</button>
    <button class="btn btn-link" ng-click="onModalCancelar()">{{'CANCELAR'|translate}}</button>
</div>
