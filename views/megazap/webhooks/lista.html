<div class="container-fluid" data-ng-controller="WebhookListaController" ng-init="onInit()">

    <div class="card" class="card" style="margin-bottom: 20px;">
        <div class="card-header ch-alt">
            <h2>
                Webhooks
                <button ng-if="hasTutorial('098')" ng-click="showTutorial('098')" title="Clique aqui para visualizar o video de explicação." class="btn btn-sm bgm-blue m-l-10 waves-effect">
                    <i class="zmdi zmdi-videocam m-r-5"></i>Tutorial
                </button>
            </h2>
            <button class="btn bgm-teal btn-float waves-effect" ng-click="onNovoRegistro()"><i class="zmdi zmdi-plus"></i></button>
        </div>
        <div class="card-body card-padding">
            <br />
            <div class="row">
        
                <div class="col-sm-4">
                    <div class="form-group fg-float m-b-30">
                        <div class="fg-line">
                            <input lta-enter="onRecuperarWebhooks()" name="nome" type="text" class="form-control fg-input input-lg"
                                ng-model="filtro.name">
                            <label class="fg-label">{{'NOME'|translate}}</label>
                        </div>
                    </div>
                </div>
                <div class="col-sm-8">
                    <div class="form-group fg-float m-b-30">
                        <div class="fg-line">
                            <input lta-enter="onRecuperarWebhooks()" name="nome" type="text" class="form-control fg-input input-lg"
                                ng-model="filtro.endpoint">
                            <label class="fg-label">Endpoint</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div ng-if="registros.length === 0" class="text-center">
        {{'NENHUM-REGISTRO'| translate}}
    </div>        

    <div ng-if="registros.length > 0" class="card" style="margin-bottom: 20px;">
        <div class="card-body">
            <div class="table-responsive">
                <table id="content-table" class="table table-striped table-vmiddle">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Endpoint</th>
                            <th>{{"DEPARTAMENTOS" | translate}}</th>
                            <th>Eventos</th>
                            <th>Bots</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="registro in registros">
                            <td>
                                {{registro.name}}
                            </td>
                            <td>
                                {{registro.endpoint}}
                            </td>
                            <td>
                                {{registro.departments}}
                            </td>
                            <td>
                                {{registro.events}}
                            </td>
                            <td>
                                {{registro.bots === 0? 'TODOS':registro.bots}}
                            </td>
                         
                            <td class="actions" style="white-space: nowrap">
                                <button ng-if="registro.id > 1" ng-click="onEditar(registro)" class="btn btn-default waves-effect"><i class="zmdi zmdi-edit"></i></button>
                                <button ng-if="registro.id > 1" ng-click="onRemover(registro)" class="btn btn-danger waves-effect"><i class="zmdi zmdi-delete"></i></button>                                
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div ng-if="showMore" class="text-center p-b-30">
        <button ng-click="onRecuperarWebhooks(true)" class="btn btn-default waves-effect"><i class="zmdi zmdi-refresh"></i>
            {{ "MAIS" | translate }}</button>
    </div>
</div>
