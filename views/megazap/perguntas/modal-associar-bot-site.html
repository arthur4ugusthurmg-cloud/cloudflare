<div class="modal-header">
    <h3>{{'ASSOCIAR-SITE'|translate}}<small>{{'ASSOCIAR-SITE-DESCRICAO'|translate}}</small></h3>
</div>
<div class="modal-body">
    <br/>
    <div class="row">
        <div class="col-sm-12">
            <div class="form-group fg-float m-b-30">
                <div class="fg-line fg-toggled">
                    <div class="select">
                        <select class="form-control input-lg select-simples" ng-model="novoBotSite.id" autofocus>
                            <option ng-repeat="botSite in botSites" value="{{botSite.id}}">{{botSite.site}}</option>
                        </select>
                        <label class="fg-label">{{'SITE'|translate}}</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button class="btn btn-link" ng-click="onModalBotSiteInserir()">{{'ENVIAR'|translate}}</button>
    <button class="btn btn-link" ng-click="onModalBotSiteCancelar()">{{'CANCELAR'|translate}}</button>
</div>
