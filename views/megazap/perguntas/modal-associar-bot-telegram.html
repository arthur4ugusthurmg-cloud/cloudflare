<div class="modal-header">
    <h3>{{'ASSOCIAR-TELEGRAM'|translate}}
    </h3>
</div>
<div class="modal-body">
    <br/>
    <div class="row">
        <div class="col-sm-12">
            <div class="form-group fg-float m-b-30">
                <div class="fg-line fg-toggled">
                    <div class="select">
                        <select class="form-control input-lg select-simples" ng-model="novoBotTelegram.id" autofocus>
                            <option ng-repeat="botTelegram in botsTelegram" value="{{botTelegram.id}}">{{botTelegram.numero}}</option>
                        </select>
                        <label class="fg-label">{{'NUMERO'|translate}}</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button class="btn btn-link" ng-click="onModalBotTelegramInserir()">{{'ENVIAR'|translate}}</button>
    <button class="btn btn-link" ng-click="onModalBotTelegramCancelar()">{{'CANCELAR'|translate}}</button>
</div>
