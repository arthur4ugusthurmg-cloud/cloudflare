<div class="modal-header">
    <h3>{{"ASSOCIAR-EMAIL" | translate}}</h3>
</div>
<div class="modal-body">
    <br/>
    <div class="row">
        <div class="col-sm-12">
            <div class="form-group fg-float m-b-30">
                <div class="fg-line fg-toggled">
                    <div class="select">
                        <select class="form-control input-lg select-simples" ng-model="novoBotEmail.id" autofocus>
                            <option ng-repeat="botEmail in botsEmail" value="{{botEmail.id}}">{{botEmail.imapUser}}</option>
                        </select>
                        <label class="fg-label">{{"CONTA-EMAIL" | translate}}</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button class="btn btn-link" ng-click="onModalBotEmailInserir()">{{'ENVIAR'|translate}}</button>
    <button class="btn btn-link" ng-click="onModalBotEmailCancelar()">{{'CANCELAR'|translate}}</button>
</div>
